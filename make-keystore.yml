name: Make keystore

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate signing key
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore release.jks -alias installlock \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=InstallLock"
          {
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_PASSWORD=$PASS"
            echo "KEY_ALIAS=installlock"
            echo "KEYSTORE_B64=$(base64 -w0 release.jks)"
          } > secrets.txt

      - uses: actions/upload-artifact@v4
        with:
          name: secrets
          path: secrets.txt
